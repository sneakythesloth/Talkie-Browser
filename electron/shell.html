<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talkie-Browser</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <header class="browser-chrome">
      <div class="tab-strip" id="tab-strip" role="tablist" aria-label="Browser tabs">
        <div class="tab-strip-spacer"></div>
        <button class="new-tab-button" id="new-tab" title="New tab (⌘/Ctrl+T)" aria-label="New tab">+</button>
      </div>
      <div class="toolbar">
        <div class="navigation-buttons">
          <button class="tool-button" id="back" title="Back" aria-label="Back">‹</button>
          <button class="tool-button" id="forward" title="Forward" aria-label="Forward">›</button>
          <button class="tool-button" id="reload" title="Reload" aria-label="Reload">↻</button>
          <button class="tool-button home-button" id="home" title="Home" aria-label="Home">⌂</button>
        </div>
        <form id="address-form" class="address-form">
          <span class="address-mark">⌕</span>
          <input id="address" type="text" autocomplete="off" spellcheck="false" placeholder="Search Google or enter an address" aria-label="Search or enter address" />
          <button class="go-button" type="submit">Go</button>
        </form>
        <button class="ai-toggle" id="ai-toggle" title="AI workspace is not wired up yet">✦ <span>AI</span></button>
        <button class="menu-button" id="menu" title="Browser menu">···</button>
      </div>
      <div class="status-line">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Ready when you are</span>
        <span class="status-right">TALKIE / EARLY BUILD</span>
      </div>
    </header>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./shell.js"></script>
  </body>
</html>
